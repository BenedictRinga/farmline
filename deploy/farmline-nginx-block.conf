# ══════════════════════════════════════════════════════════════════════════
# farmline's nginx block — THE CANONICAL SET (2026-10-06).
#
# Owned by scripts/farmline-nginx-ensure.sh: idempotently removed and
# re-inserted. NEVER hand-edit farmline's blocks in the live conf — a deploy
# verifies this exact set, and a hand edit dies the next time it runs.
#
# SHAPE NOTES (each load-bearing):
#  · ^~ on /api/farmline/ and /socket-farmline/ — these prefixes beat ANY regex
#    location elsewhere in the shared conf. The 2026-10-06 outage was the API
#    404ing from nginx itself after the shared conf changed around us; ^~ is
#    the belt against every future shadowing/regeneration.
#  · The static asset regexes stay PLAIN (no ^~) so they keep winning over the
#    /farmline/ SPA prefix — a missing hashed asset must be a real 404, never
#    the shell (the ChunkLoadError storm lesson).
#  · proxy_pass carries NO URI — the full original path reaches Node.
# ══════════════════════════════════════════════════════════════════════════

    # ── FARMLINE — the farmer's records app ─────────────────────────────
    # Static Angular bundle (base-href /farmline/) from /var/www/farmline;
    # the API and the chat socket proxy to farmline-server (:4600).
    location = /farmline {
        return 301 /farmline/;
    }

    location = /farmline/index.html {
        alias /var/www/farmline/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        # THE HEADER-INHERITANCE FIX (2026-10-13, applied live first — this is the sync).
        # nginx's add_header does NOT inherit into a location that defines its own, and
        # this one defines Cache-Control. So the SPA location's HSTS + CSP never reached
        # the one response that matters most — the HTML document. They are repeated here
        # BY DESIGN. Removing them from this location (or "tidying them up") silently
        # strips HSTS and CSP from the shell, and the next ensure run would then revert
        # the live fix: this file is the canonical set the script re-inserts.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # THE SPLASH INCIDENT (2026-10-13): the CSP here (script-src 'self')
                # BLOCKED the app's own inline splash-dismissal script in index.html -
                # the app hung on the splash during update. The CSP line is COMMENTED
                # BY DESIGN (the live conf carries the same comment). HSTS stays. The
                # durable CSP shape for later: a sha256 hash-allowance for the ONE
                # splash script, or move that script to an external file - NEVER
                # 'unsafe-inline' in script-src. Removing this comment block or
                # re-enabling the CSP without the hash re-breaks the splash.
        # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://openrouter.ai; frame-ancestors 'none'" always;
    }

    # Hashed bundles: content-addressed, immutable for a week.
    location ~* "^/farmline(/.+\.[0-9a-f]{16,}\.(?:js|css|woff2?))$" {
        alias /var/www/farmline$1;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Unhashed assets (i18n JSON, manifest, icons): no-cache, real 404 on miss.
    location ~* ^/farmline(/.+\.(?:js|mjs|css|map|woff2?|png|jpe?g|gif|svg|ico|webmanifest|json|txt))$ {
        alias /var/www/farmline$1;
        add_header Cache-Control "no-cache";
    }

    # THE SPA FALLBACK — the shell for navigations only.
    #
    # ── THE SHARE HOOK (2026-10-12) ──────────────────────────────────────────────
    # A farmer shares /farmline/s/<slug>. WhatsApp and Telegram then fetch that URL
    # with a BOT user agent to build the preview card — and until this block existed
    # they got the shell, i.e. a bare link with no farm name, no face and no shelf.
    # The share IS farmline's distribution engine, so the hook was missing exactly
    # where intent is highest. Bots are routed to the per-farm OG JSON the server
    # already publishes (GET /api/farmline/og/s/:slug); humans fall through unchanged.
    #
    # `rewrite ... last` inside `if` is the documented-safe form (the "if is evil"
    # cases are about other directives). It re-runs location matching, so the
    # rewritten URI lands on the ^~ /api/farmline/ block below and proxies to Node.
    location /farmline/ {
        alias /var/www/farmline/;
        if ($http_user_agent ~* (facebookexternalhit|WhatsApp|TelegramBot|Twitterbot|LinkedInBot|Slackbot)) {
            rewrite ^/farmline/s/([a-z0-9-]+)$ /api/farmline/og/s/$1 last;
        }
        # ── B14: the transport/isolation headers ─────────────────────────────────
        # HSTS is safe to add at any time. CSP IS NOT: the app writes inline `style=`
        # attributes throughout, so `style-src 'unsafe-inline'` is LOAD-BEARING. After
        # applying, open the app in a browser and check the shell, the shop, the record
        # forms and the ZU card — then revert the CSP line ALONE if anything breaks.
        # (Note: add_header does not inherit into the asset locations above, which
        # carry their own Cache-Control headers. HSTS on the HTML is what matters; if
        # the founder wants it on every response, it belongs in the server block.)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # THE SPLASH INCIDENT (2026-10-13): the CSP here (script-src 'self')
                # BLOCKED the app's own inline splash-dismissal script in index.html -
                # the app hung on the splash during update. The CSP line is COMMENTED
                # BY DESIGN (the live conf carries the same comment). HSTS stays. The
                # durable CSP shape for later: a sha256 hash-allowance for the ONE
                # splash script, or move that script to an external file - NEVER
                # 'unsafe-inline' in script-src. Removing this comment block or
                # re-enabling the CSP without the hash re-breaks the splash.
        # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://openrouter.ai; frame-ancestors 'none'" always;
        try_files $uri $uri/ /farmline/index.html;
    }

    # THE API — ^~ so no regex elsewhere in the shared conf can shadow it.
    location ^~ /api/farmline/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
    }

    # THE CHAT SOCKET — Upgrade headers + long idle timeouts (a chat socket
    # idles between messages; the 60s default would cut it every minute).
    location ^~ /socket-farmline/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
