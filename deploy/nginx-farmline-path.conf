# ─────────────────────────────────────────────────────────────────────────────
# farmline at https://zyppar.com/farmline/   (nginx inserts)
#
# WHERE WE ARE (mirrors loopkeeper's deploy/nginx-loopkeeper-path.conf):
#   /opt/zyppar-server    Zyppar backend        (Node)
#   /opt/rolodex-server   LoopKeeper backend    (Node, :4411)
#   /opt/farmline-server  farmline backend      (Node, :4600)
#   /var/www/rolodex      LoopKeeper's Angular build (static, aliased)
#
# ONE DIFFERENCE FROM LOOPKEEPER — and it is deliberate:
#   LoopKeeper serves an Angular build from /var/www/rolodex via `alias`, with the
#   API on a separate port. farmline ships NO build step and NO separate static
#   directory: the Node process serves public/index.html itself (40 KB, one file,
#   zero dependencies). So farmline needs NO alias — BOTH prefixes simply proxy
#   to the Node process. Fewer moving parts, and nothing to go stale on disk.
#
# HOW TO APPLY (on the droplet):
#   1. Add these location blocks inside the existing
#      `server { server_name zyppar.com; }` block, BEFORE the generic
#      `location / { try_files ...; }`.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. Verify (see the block at the bottom of this file).
#
# Do NOT remove or reorder the existing /api/loopkeeper/ or /api/openloop/ blocks.
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# 1. THE API — https://zyppar.com/api/farmline/  ->  Node :4600
# ═══════════════════════════════════════════════════════════════════════════════
# Required. Without it every farmer write, order, ladder read and money call
# fails — and (this is the trap LoopKeeper hit) it fails SILENTLY, because the
# generic `location /` happily serves the frontend shell at HTTP 200 for the
# missing API path. A 200 with HTML where JSON was expected.
location /api/farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Photos from the Photo Kit ride as JSON. Node accepts 4 MB; the door must
    # be at least as wide, or nginx answers 413 before Express ever sees it.
    client_max_body_size 12M;

    # A farmer on a weak connection must not have a log entry cut off mid-write.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# ═══════════════════════════════════════════════════════════════════════════════
# 1b. THE SOCKET — https://zyppar.com/socket-farmline/  ->  Node :4600
# ═══════════════════════════════════════════════════════════════════════════════
# Chat between a farmer and a buyer. The path is NAMESPACED because three products
# share this nginx: Zyppar owns /socket.io, LoopKeeper owns /socket-rolodex/. A
# shared path would not fail loudly — it would fail by silently delivering one
# product's events to another.
#
# The two Upgrade headers are not optional. Without them socket.io falls back to
# long-polling: chat still WORKS, so the bug hides, but every message costs several
# round trips and the typing indicator stops being immediate. It looks like a slow
# network rather than a misconfiguration.
#
# The long timeouts are equally load-bearing. A chat socket is IDLE between
# messages; nginx's default 60s read timeout would cut the connection every minute
# and force a reconnect loop that drains phone batteries.
location /socket-farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ═══════════════════════════════════════════════════════════════════════════════
# 2. THE APP — https://zyppar.com/farmline/  ->  a STATIC Angular build
# ═══════════════════════════════════════════════════════════════════════════════
# ⚠ CHANGED 2026-10-03 (build 8 → farmline-app). The topology reverted to
#   LOOPKEEPER'S shape, and this block is the reason.
#
#   BEFORE: farmline's frontend was one hand-written HTML file, so the Node process
#           served it and nginx proxied /farmline/ to :4600.
#   NOW:    farmline-app is an Angular build. Its output is STATIC (www/), so nginx
#           serves it from disk with `alias` — exactly like /var/www/rolodex — and
#           ONLY the API and the socket proxy to Node.
#
#   Leaving the old proxy here would break the app: Node no longer serves the
#   frontend, so /farmline/ would return an API 404 instead of the app.
#
# Deploy the build to /var/www/farmline (see farmline-app/deploy.sh).
# The bare path without a trailing slash: redirect, so relative asset paths and the
# farm-share links never resolve one directory up.
location = /farmline {
    return 301 /farmline/;
}

# Hashed bundles are content-addressed — immutable for a week. They change name on
# every build, so caching them hard is safe and saves the farmer a re-download.
location ~* "^/farmline(/.+\.[0-9a-f]{16,}\.(?:js|css|woff2?))$" {
    alias /var/www/farmline$1;
    add_header Cache-Control "public, max-age=604800, immutable";
}

# Unhashed assets (i18n JSON, manifest, icons): real 404 on a miss, never pinned.
location ~* ^/farmline(/.+\.(?:js|mjs|css|map|woff2?|png|jpe?g|gif|svg|ico|webmanifest|json|txt))$ {
    alias /var/www/farmline$1;
    add_header Cache-Control "no-cache";
}

# THE SPA FALLBACK. A deep link (/farmline/s/<slug>, /farmline/farmer/today) has no
# file on disk, so the shell is handed to NAVIGATIONS only — never to a missing
# asset, which must 404 (that was LoopKeeper's ChunkLoadError storm).
location /farmline/ {
    alias /var/www/farmline/;
    try_files $uri $uri/ /farmline/index.html;
}

# ═══════════════════════════════════════════════════════════════════════════════
# 3. THE APP SHELL MUST NEVER BE CACHED
# ═══════════════════════════════════════════════════════════════════════════════
# THE LOOPKEEPER LESSON, IN ITS ORIGINAL SETTING.
#
# Angular emits hashed chunk files whose names change every build. A tab that
# survived a deploy still holds the OLD index.html, which points at chunk files
# that no longer exist → the module MIME check refuses them → ChunkLoadError and
# the surface dies until a manual reload. Pinning the shell to no-cache is what
# stops that from starting.
location = /farmline/index.html {
    alias /var/www/farmline/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

# A missing API path must be a REAL 404, never the shell. (Belt to the braces
# above: if a route is missing on the Node side, say so instead of pretending.)
location ~ ^/api/farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
}

# ═══════════════════════════════════════════════════════════════════════════════
# VERIFY AFTER RELOAD
# ═══════════════════════════════════════════════════════════════════════════════
#   # the API answers JSON, not HTML  (the silent-failure check)
#   curl -s https://zyppar.com/api/farmline/version
#     # -> {"version":"0.1.2","build":3,...}
#
#   # the Node process is the one answering, and the db is ours
#   curl -s https://zyppar.com/health | head -c 200
#     # -> {"ok":true,"db":"connected","dbName":"farmline",...}
#
#   # the app shell loads
#   curl -sI https://zyppar.com/farmline/ | head -1
#     # -> HTTP/2 200
#
#   # the shell is NOT cached
#   curl -sI https://zyppar.com/farmline/index.html | grep -i cache-control
#     # -> cache-control: no-cache, must-revalidate
#
#   # a farm deeplink resolves (this is the DISTRIBUTION link — test it)
#   curl -s -o /dev/null -w '%{http_code}\n' https://zyppar.com/farmline/s/test-farm
#     # -> 200
#
#   # AND the neighbours still work — never break the other tenants
#   curl -s https://zyppar.com/api/loopkeeper/health
#   curl -sI https://zyppar.com/loopkeeper/ | head -1
#
# ROLLBACK: comment the two proxy blocks out, `sudo nginx -t`,
#           `sudo systemctl reload nginx`. The Node process is untouched.
# ─────────────────────────────────────────────────────────────────────────────
