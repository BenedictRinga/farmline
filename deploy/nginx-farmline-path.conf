# ─────────────────────────────────────────────────────────────────────────────
# farmline at https://zyppar.com/farmline/   (nginx inserts)
#
# WHERE WE ARE (mirrors loopkeeper's deploy/nginx-loopkeeper-path.conf):
#   /opt/zyppar-server    Zyppar backend        (Node)
#   /opt/rolodex-server   LoopKeeper backend    (Node, :4411)
#   /opt/farmline-server  farmline backend      (Node, :4600)
#   /var/www/rolodex      LoopKeeper's Angular build (static, aliased)
#
# ONE DIFFERENCE FROM LOOPKEEPER — and it is deliberate:
#   LoopKeeper serves an Angular build from /var/www/rolodex via `alias`, with the
#   API on a separate port. farmline ships NO build step and NO separate static
#   directory: the Node process serves public/index.html itself (40 KB, one file,
#   zero dependencies). So farmline needs NO alias — BOTH prefixes simply proxy
#   to the Node process. Fewer moving parts, and nothing to go stale on disk.
#
# HOW TO APPLY (on the droplet):
#   1. Add these location blocks inside the existing
#      `server { server_name zyppar.com; }` block, BEFORE the generic
#      `location / { try_files ...; }`.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. Verify (see the block at the bottom of this file).
#
# Do NOT remove or reorder the existing /api/loopkeeper/ or /api/openloop/ blocks.
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# 1. THE API — https://zyppar.com/api/farmline/  ->  Node :4600
# ═══════════════════════════════════════════════════════════════════════════════
# Required. Without it every farmer write, order, ladder read and money call
# fails — and (this is the trap LoopKeeper hit) it fails SILENTLY, because the
# generic `location /` happily serves the frontend shell at HTTP 200 for the
# missing API path. A 200 with HTML where JSON was expected.
location /api/farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Photos from the Photo Kit ride as JSON. Node accepts 4 MB; the door must
    # be at least as wide, or nginx answers 413 before Express ever sees it.
    client_max_body_size 12M;

    # A farmer on a weak connection must not have a log entry cut off mid-write.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# ═══════════════════════════════════════════════════════════════════════════════
# 2. THE APP — https://zyppar.com/farmline/  ->  Node :4600
# ═══════════════════════════════════════════════════════════════════════════════
# The bare path without a trailing slash: redirect so relative asset paths and
# the farm-share links never resolve one directory up.
location = /farmline {
    return 301 /farmline/;
}

location /farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ═══════════════════════════════════════════════════════════════════════════════
# 3. THE APP SHELL MUST NEVER BE CACHED
# ═══════════════════════════════════════════════════════════════════════════════
# THIS IS THE LOOPKEEPER LESSON, APPLIED BEFORE WE HIT IT.
#
# A phone that survived a deploy keeps the old shell in cache. Because farmline's
# HTML is served by Node with a 1h maxAge (see express.static in src/index.js),
# a returning farmer can get a STALE SHELL pointing at a build that no longer
# matches the API. LoopKeeper's version of this was the ChunkLoadError storm:
# a missing asset answered with index.html at HTTP 200, the MIME check refused
# it, and the surface died until a manual reload.
#
# farmline has no hashed chunks, but it has the same class of bug. Pin the shell
# to no-cache; the app is 40 KB and re-fetching it is cheaper than a stale app.
location = /farmline/index.html {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, must-revalidate";
}

# A missing API path must be a REAL 404, never the shell. (Belt to the braces
# above: if a route is missing on the Node side, say so instead of pretending.)
location ~ ^/api/farmline/ {
    proxy_pass http://127.0.0.1:4600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
}

# ═══════════════════════════════════════════════════════════════════════════════
# VERIFY AFTER RELOAD
# ═══════════════════════════════════════════════════════════════════════════════
#   # the API answers JSON, not HTML  (the silent-failure check)
#   curl -s https://zyppar.com/api/farmline/version
#     # -> {"version":"0.1.2","build":3,...}
#
#   # the Node process is the one answering, and the db is ours
#   curl -s https://zyppar.com/health | head -c 200
#     # -> {"ok":true,"db":"connected","dbName":"farmline",...}
#
#   # the app shell loads
#   curl -sI https://zyppar.com/farmline/ | head -1
#     # -> HTTP/2 200
#
#   # the shell is NOT cached
#   curl -sI https://zyppar.com/farmline/index.html | grep -i cache-control
#     # -> cache-control: no-cache, must-revalidate
#
#   # a farm deeplink resolves (this is the DISTRIBUTION link — test it)
#   curl -s -o /dev/null -w '%{http_code}\n' https://zyppar.com/farmline/s/test-farm
#     # -> 200
#
#   # AND the neighbours still work — never break the other tenants
#   curl -s https://zyppar.com/api/loopkeeper/health
#   curl -sI https://zyppar.com/loopkeeper/ | head -1
#
# ROLLBACK: comment the two proxy blocks out, `sudo nginx -t`,
#           `sudo systemctl reload nginx`. The Node process is untouched.
# ─────────────────────────────────────────────────────────────────────────────
